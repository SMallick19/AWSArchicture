name: CICD pipeline for OIDC check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main    

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Test OIDC
        run: aws sts get-caller-identity
      - name: Test Pipeline 
        run: echo "Pipeline is working fine" 
