name: CICD pipeline for OIDC check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "763103708432"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:latest

jobs:
  Terraform-plan-pr:
    name: Terraform Plan - PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
      - name: Terraform Init
        working-directory: ./environment/dev
        run: terraform init
      - name: Terraform Validate
        working-directory: ./environment/dev
        run: terraform validate
      - name: Terraform Plan
        working-directory: ./environment/dev
        run: terraform plan -var="docker_image=${{ env.DOCKER_IMAGE }}"
  
  Build-and-push-docker-image:
    name: Build and push docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }} ./app
      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}

  Terraform-plan-dev:
    name: Terraform Plan - DEV
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
      - name: Terraform Init
        working-directory: ./environment/dev
        run: terraform init
      - name: Terraform Validate
        working-directory: ./environment/dev
        run: terraform validate
      - name: Terraform Plan
        working-directory: ./environment/dev
        run: terraform plan -var="docker_image=${{ env.DOCKER_IMAGE }}" -out=tfplan
      - name: Save Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: ./environment/dev/tfplan

  Terraform-apply-dev:
    name: Terraform Apply - DEV
    runs-on: ubuntu-latest
    needs: Terraform-plan-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #env protection
    environment:
      name: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
      - name: Terraform Init
        working-directory: ./environment/dev
        run: terraform init
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: ./environment/dev
      - name: Terraform Apply
        working-directory: ./environment/dev
        run: terraform apply -auto-approve tfplan