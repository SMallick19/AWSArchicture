name: CICD pipeline for OIDC check

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Terraform environment"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
  push:
    branches:
      - main
  pull_request:
    branches:
      - main    

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "763103708432"

jobs:
  Terraformm-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
      - name: Terraform Init
        working-directory: ./environment/${{ inputs.environment }}
        run: terraform init
      - name : Terraform Validate
        working-directory: ./environment/${{ inputs.environment }}
        run: terraform validate
      - name: Terraform Plan
        working-directory: ./environment/${{ inputs.environment }}
        run: terraform plan -out=tfplan
      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  Terraformm-apply:
    runs-on: ubuntu-latest
    needs: Terraformm-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15
      - name: Terraform Init
        working-directory: ./environment/${{ inputs.environment }}
        run: terraform init
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
      - name: Terraform Apply
        run: echo "working fine"