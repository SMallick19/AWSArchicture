name: CICD pipeline for OIDC check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main    

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "763103708432"

jobs:
  OIDC-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: us-east-1
 
      - name: Verify AWS Identity
        run: aws sts get-caller-identity
      - name: Test Pipeline 
        run: echo "Pipeline is working fine" 
